<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Gate">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gate Check-In · RSVP</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{ --bg:#0f172a; --card:#ffffff; --green:#15803d; --green2:#16a34a; --red:#b91c1c; --amber:#b45309; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{ font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#fff;
        display:flex; flex-direction:column; min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header{ padding:16px 18px; display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; }
  header .dot{ width:10px; height:10px; border-radius:50%; background:var(--green2); box-shadow:0 0 0 4px rgba(22,163,74,.25); }
  main{ flex:1; display:flex; flex-direction:column; padding:0 16px 20px; }
  .scanwrap{ flex:1; display:flex; flex-direction:column; }
  #reader{ width:100%; border-radius:18px; overflow:hidden; background:#000; }
  #reader video{ border-radius:18px; }
  .hint{ text-align:center; color:#cbd5e1; font-size:15px; margin:14px 6px 0; }
  .card{ background:var(--card); color:var(--ink); border-radius:20px; padding:22px; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .pill{ display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
         padding:5px 11px; border-radius:999px; }
  .name{ font-size:24px; font-weight:800; margin:14px 0 2px; }
  .sub{ color:var(--muted); font-size:15px; }
  .tally{ display:flex; gap:8px; margin:16px 0 4px; }
  .tile{ flex:1; background:#f1f5f9; border-radius:14px; padding:12px 6px; text-align:center; }
  .tile b{ display:block; font-size:26px; line-height:1; margin-bottom:4px; }
  .tile span{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .tile.left b{ color:var(--green); }
  button{ font-family:inherit; cursor:pointer; border:0; border-radius:14px; font-weight:700; }
  .btn-primary{ width:100%; background:var(--green); color:#fff; font-size:18px; padding:16px; margin-top:14px; }
  .btn-primary:active{ background:#136a33; }
  .btn-amber{ width:100%; background:var(--amber); color:#fff; font-size:17px; padding:15px; margin-top:12px; }
  .btn-ghost{ width:100%; background:#fff; color:var(--green); border:2px solid var(--green); font-size:16px; padding:13px; margin-top:10px; }
  .btn-ghost.gray{ color:var(--muted); border-color:var(--line); }
  .btn-dark{ width:100%; background:var(--bg); color:#fff; font-size:16px; padding:15px; margin-top:14px; }
  .paybar{ display:flex; gap:8px; margin-top:14px; }
  .paybar button{ flex:1; font-size:15.5px; padding:14px 6px; }
  .pay-upi{ background:#1d4ed8; color:#fff; }
  .pay-cash{ background:var(--green); color:#fff; }
  .amount{ display:flex; align-items:baseline; justify-content:space-between; background:#fff7ed; border:1px solid #fed7aa;
           border-radius:14px; padding:12px 16px; margin-top:14px; }
  .amount.ok{ background:#f0fdf4; border-color:#bbf7d0; }
  .amount .lbl{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
  .amount .val{ font-size:30px; font-weight:800; }
  .amount small{ font-size:12px; color:var(--muted); font-weight:600; }
  .party{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:14px; }
  .pcol{ min-width:0; background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:7px 4px; text-align:center; }
  .pcol .plbl{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:700; }
  .pcol .pctl{ display:flex; align-items:center; justify-content:center; gap:4px; margin-top:4px; }
  .pcol button{ width:28px; height:28px; font-size:17px; background:#e2e8f0; color:var(--ink); border-radius:8px; flex:none; }
  .pcol .pnum{ font-size:19px; font-weight:800; min-width:16px; }
  .stepper{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:16px; }
  .stepper button{ width:54px; height:54px; font-size:28px; background:#f1f5f9; color:var(--ink); }
  .stepper .num{ font-size:38px; font-weight:800; min-width:64px; text-align:center; }
  .center{ text-align:center; }
  .big-emoji{ font-size:64px; line-height:1.1; }
  .msg-title{ font-size:23px; font-weight:800; margin:6px 0 4px; }
  .qrbox{ background:#fff; border-radius:16px; padding:14px; text-align:center; margin-top:14px; border:1px solid var(--line); }
  .qrbox img{ width:min(72vw,290px); height:auto; }
  .wait{ color:var(--muted); font-size:14px; margin-top:8px; }
  .wait .dots::after{ content:'…'; animation:d 1.4s steps(4) infinite; }
  @keyframes d{ 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
  .spin{ width:40px; height:40px; border:4px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%;
         animation:r 1s linear infinite; margin:40px auto; }
  @keyframes r{ to{ transform:rotate(360deg); } }
  .err{ color:#fecaca; text-align:center; font-size:14px; margin-top:10px; }
  .warnday{ background:#fef3c7; border:1px solid #fcd34d; color:#92400e; border-radius:12px;
            padding:10px 12px; font-size:13.5px; font-weight:700; margin-top:12px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<header><span class="dot"></span> Gate Check-In <span style="font-size:12px;background:#1d4ed8;border-radius:999px;padding:3px 10px;margin-left:auto">RSVP</span></header>
<main>
  <section id="scanView" class="scanwrap">
    <div id="reader"></div>
    <p class="hint">Point the camera at the guest's QR code.</p>
    <button id="startBtn" class="btn-primary hidden" onclick="startScanner()">📷 Tap to start camera</button>
    <p id="scanErr" class="err"></p>
    <button class="btn-ghost" onclick="showLog()" style="margin-top:14px">📖 Tonight's admissions</button>
  </section>
  <section id="loadView" class="hidden"><div class="spin"></div></section>
  <section id="resultView" class="hidden"></section>
</main>

<script>
/* ========= CONFIG ============================================= */
const API_URL  = "https://n8n-meukron.modanova-events.co.in/webhook/verify";
const GATE_KEY = "mg_gate_2025";   // must match config GATE_SECRET (read-only ops)
/* ============================================================== */

const $ = (id) => document.getElementById(id);
let qr = null, busy = false, last = null;
let cur = null;           // latest lookup payload
let party = null;         // {men,women,couples} staff-adjusted
let pollTimer = null;

function show(view){ for (const v of ["scanView","loadView","resultView"]) $(v).classList.toggle("hidden", v !== view); }

function staffCode(force){
  let s = localStorage.getItem('gate_staff') || '';
  if (force || !s){
    const inp = prompt('Staff code:');
    if (inp === null) return null;          // user cancelled
    s = inp.trim();
    if (!s) return null;
    localStorage.setItem('gate_staff', s);
  }
  return s.trim();
}

async function startScanner(){
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  show("scanView"); $("scanErr").textContent = ""; busy = false; last = null; cur = null; party = null;
  $("startBtn").classList.add("hidden");
  if (!qr) qr = new Html5Qrcode("reader", { verbose:false });
  try{
    await qr.start({ facingMode:"environment" }, { fps:10, qrbox:{ width:240, height:240 } }, onScan, ()=>{});
  }catch(e){
    $("scanErr").textContent = "Allow camera access, then tap below.";
    $("startBtn").classList.remove("hidden");
  }
}
async function stopScanner(){ if (qr){ try{ await qr.stop(); }catch(_){} } }

function onScan(text){
  if (busy) return;
  const payload = String(text).trim();
  if (payload === last) return;
  last = payload; busy = true;
  stopScanner().then(()=> lookup(payload));
}

function parsePayload(p){
  const i = p.indexOf("|");
  if (i < 0) return null;
  return { id: p.slice(0,i).trim(), t: p.slice(i+1).trim() };
}

async function call(extra){
  let url = API_URL + "?id=" + encodeURIComponent(cur._id) + "&t=" + encodeURIComponent(cur._t) + "&key=" + encodeURIComponent(GATE_KEY);
  for (const [k,v] of Object.entries(extra||{})) if (v!==null && v!==undefined) url += "&"+k+"="+encodeURIComponent(v);
  const res = await fetch(url, { method:"GET", cache:"no-store" });
  return res.json();
}
const partyParams = ()=> party ? { men:party.men, women:party.women, couples:party.couples } : {};

async function lookup(payload){
  const parsed = parsePayload(payload);
  if (!parsed){ return renderMessage("#b91c1c","🚫","Not a booking code","That QR isn't from this system."); }
  show("loadView");
  cur = { _id: parsed.id, _t: parsed.t };
  try{
    const d = await call({});
    d._id = parsed.id; d._t = parsed.t; cur = d; cur._id = parsed.id; cur._t = parsed.t;
    party = { men:Number(d.men)||0, women:Number(d.women)||0, couples:Number(d.couples)||0 };
    renderResult(d);
  }catch(e){
    renderMessage("#334155","📡","Connection problem","Couldn't reach the server. Check internet and try again.");
  }
}

async function requote(){
  show("loadView");
  try{ const d = await call(partyParams()); d._id = cur._id; d._t = cur._t; cur = d; renderResult(d); }
  catch(e){ renderResult(cur); }
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const rupee = (n)=> "₹" + (Number(n)||0).toLocaleString("en-IN");

function wrongDayBanner(d){
  if (!d.wrongDay) return "";
  const dt = d.bookingDate ? new Date(d.bookingDate+"T12:00:00Z") : null;
  const lbl = dt ? dt.toUTCString().slice(0,11) : d.bookingDate;
  return `<div class="warnday">⚠️ This booking is for ${esc(lbl)} — NOT tonight. Admit at your discretion.</div>`;
}
function statusPill(d){
  if (d.paymentStatus === "paid") return '<span class="pill" style="background:#dcfce7;color:#15803d">Confirmed · paid</span>';
  return '<span class="pill" style="background:#fef3c7;color:#b45309">Tentative · unpaid</span>';
}
function headerRows(d){
  const type = [d.slotType, d.time].filter(Boolean).join(" · ");
  return `<div class="name">${esc(d.name)}</div>
          <div class="sub">${esc(type)}${d.event? " &nbsp;·&nbsp; "+esc(d.event):""}${d.isAfter?" &nbsp;·&nbsp; after 9:30":" &nbsp;·&nbsp; before 9:30"}</div>`;
}
function partyEditor(d){
  const col=(k,lbl)=>`<div class="pcol"><div class="plbl">${lbl}</div><div class="pctl">
      <button onclick="bump('${k}',-1)">−</button><div class="pnum" id="p_${k}">${party[k]}</div><button onclick="bump('${k}',1)">+</button>
    </div></div>`;
  return `<div class="party">${col('men','Men')}${col('women','Women')}${col('couples','Couples')}</div>
          <button class="btn-ghost gray" onclick="requote()" style="margin-top:10px">↻ Update amount</button>`;
}
function bump(k,delta){ party[k]=Math.max(0,Math.min(20,(party[k]||0)+delta)); $("p_"+k).textContent=party[k]; }

function renderResult(d){
  show("resultView");
  if (!d.found){ return renderMessage("#b91c1c","❌","Not registered","No booking matches this code."); }
  if (d.cancelled){ return renderMessage("#b45309","🚫","Booking cancelled","This booking was cancelled. Entry not permitted."); }
  if (d.expired){ return renderMessage("#b45309","📅","Wrong day", d.message || "This QR is not valid tonight."); }
  if (!d.valid){ return renderMessage("#b91c1c","⛔","Invalid / fake code","This QR could not be verified."); }
  if (d.full){ return renderAlreadyScanned(d); }

  const needsMoney = (d.paymentStatus !== "paid") || (Number(d.balance) > 0);
  if (!needsMoney) return admitPanel(d);

  const isBalance = d.paymentStatus === "paid";
  const due = isBalance ? Number(d.balance) : Number(d.amountDue);
  const unknownParty = (Number(d.seats)||0) === 0;
  $("resultView").innerHTML =
    `<div class="card">${statusPill(d)}${headerRows(d)}
      ${wrongDayBanner(d)}
      ${partyEditor(d)}
      <div class="amount"><div><div class="lbl">${isBalance?'Balance due (late arrival)':'Collect'}</div>
        <div class="val">${rupee(due)}</div></div>
        <small>${isBalance? 'paid '+rupee(d.amountPaid) : (unknownParty?'set party above':'per scan time')}</small></div>
      ${due>0?`<div class="paybar">
        <button class="pay-upi" onclick="startUpi(${due})">📱 UPI QR</button>
        <button class="pay-cash" onclick="cashCollect(${due})">💵 Cash</button>
      </div>`:''}
      <button class="btn-amber" onclick="admitPanel(cur)">${isBalance?'Waive & admit':'Admit without payment'}</button>
      <button class="btn-dark" onclick="startScanner()">Cancel · scan next</button>
      <p id="actErr" class="err" style="color:#b91c1c"></p>
    </div>`;
}

async function startUpi(amount){
  show("loadView");
  try{
    const r = await call(Object.assign({ action:"upi", amount }, partyParams()));
    if (!r.upi || !r.qrImage){ renderResult(cur); $("actErr")&&($("actErr").textContent=(r && r.error) ? ("Payment QR failed: " + r.error) : "Couldn't create payment QR."); return; }
    show("resultView");
    $("resultView").innerHTML =
      `<div class="card center">
         <div class="msg-title">Scan to pay ${rupee(r.amount)}</div>
         <div class="qrbox"><img src="${esc(r.qrImage)}" alt="UPI QR"></div>
         <div class="wait">Waiting for payment<span class="dots"></span></div>
         <button class="btn-dark" onclick="requote()">← Back</button>
       </div>`;
    let tries = 0;
    pollTimer = setInterval(async ()=>{
      tries++;
      try{
        const d = await call(partyParams());
        if (d.paymentStatus === "paid" && Number(d.balance) <= 0){
          clearInterval(pollTimer); pollTimer=null;
          d._id=cur._id; d._t=cur._t; cur=d;
          admitPanel(d, "Payment received ✓");
        }
      }catch(_){}
      if (tries > 100){ clearInterval(pollTimer); pollTimer=null; requote(); }
    }, 3000);
  }catch(e){ renderResult(cur); }
}

async function cashCollect(amount){
  const staff = staffCode(false);
  if (staff === null){ renderResult(cur); return; }
  show("loadView");
  try{
    const r = await call(Object.assign({ action:"cash", amount, staff }, partyParams()));
    if (r.message === "Staff code required" || r.staffAuth === false){
      localStorage.removeItem('gate_staff');
      if (staffCode(true) === null){ renderResult(cur); return; }
      return cashCollect(amount);
    }
    r._id=cur._id; r._t=cur._t; cur=r;
    admitPanel(r, "Cash collected " + rupee(amount) + " ✓");
  }catch(e){ renderResult(cur); }
}

function admitPanel(d, note){
  show("resultView");
  const seats = Number(d.seats)||0;
  const rw = Number(d.remaining);
  const remaining = Number.isFinite(rw) ? Math.max(0, rw) : (seats>0?seats:0);
  if (seats>0 && remaining<=0) return renderAlreadyScanned(d);
  const canAll = remaining > 0;
  $("resultView").innerHTML =
    `<div class="card">${statusPill(d)}${headerRows(d)}
      ${wrongDayBanner(d)}
      ${note?`<div class="sub" style="color:#15803d;font-weight:700;margin-top:8px">${esc(note)}</div>`:""}
      <div class="tally">
        <div class="tile"><b>${seats||'—'}</b><span>Booked</span></div>
        <div class="tile"><b>${d.checkedIn||0}</b><span>Entered</span></div>
        <div class="tile left"><b>${seats?remaining:'—'}</b><span>Left</span></div>
      </div>
      ${seats===0?`<p class="sub">Party size unknown — set it on the previous screen, or admit by count:</p>`:""}
      ${canAll?`<button class="btn-primary" onclick="doCheckin(${remaining})">✓ Check in all (${remaining})</button>`:""}
      <button class="btn-ghost" id="partBtn" onclick="showStepper(${Math.max(remaining,10)})">Partial entry…</button>
      <div id="stepWrap" class="hidden">
        <div class="stepper">
          <button onclick="setN(n-1)">−</button><div class="num" id="num">1</div><button onclick="setN(n+1)">+</button>
        </div>
        <button class="btn-primary" onclick="doCheckin(n)">Admit <span id="confirmN">1</span> →</button>
      </div>
      <button class="btn-dark" onclick="startScanner()">Scan next</button>
      <p id="actErr" class="err" style="color:#b91c1c"></p>
    </div>`;
}
let n = 1, nMax = 10;
function showStepper(max){ nMax = Math.max(1, max); n = 1; $("stepWrap").classList.remove("hidden"); $("partBtn").classList.add("hidden"); setN(1); }
function setN(v){ n = Math.max(1, Math.min(nMax, v)); $("num").textContent = n; $("confirmN").textContent = n; }

async function doCheckin(count){
  const staff = staffCode(false);
  if (staff === null){ admitPanel(cur); return; }
  show("loadView");
  try{
    const r = await call(Object.assign({ count, staff }, partyParams()));
    if (r.message === "Staff code required" || r.staffAuth === false){
      localStorage.removeItem('gate_staff');
      if (staffCode(true) === null){ admitPanel(cur); return; }
      return doCheckin(count);
    }
    r._id=cur._id; r._t=cur._t; cur=r;
    renderCheckedIn(r);
  }catch(e){
    admitPanel(cur); $("actErr") && ($("actErr").textContent = "Network error — not recorded. Try again.");
  }
}

function renderCheckedIn(d){
  show("resultView");
  const more = d.full
    ? `<div style="color:#b45309;font-weight:700;margin-top:6px">Booking now full — QR is now void.</div>`
    : `<div class="sub" style="margin-top:6px">${d.remaining} more still allowed on this QR.</div>`;
  $("resultView").innerHTML =
    `<div class="card center">
       <div class="big-emoji">✅</div>
       <div class="msg-title">Admitted ${d.justEntered}</div>
       <div style="font-size:18px;color:#15803d;font-weight:700">${d.checkedIn} of ${d.seats||'?'} entered</div>
       ${more}
       <button class="btn-primary" style="margin-top:20px" onclick="startScanner()">Scan next guest</button>
     </div>`;
}

/* ========= Admissions log (escalation lookups) ================= */
let logEntries = [];

async function showLog(){
  const staff = staffCode(false);
  if (staff === null) return;
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  await stopScanner();
  show("loadView");
  let r;
  try{
    const res = await fetch(API_URL + "?action=log&key=" + encodeURIComponent(GATE_KEY) +
                            "&staff=" + encodeURIComponent(staff), { cache:"no-store" });
    r = await res.json();
  }catch(e){
    return renderMessage("#334155","📡","Connection problem","Couldn't load the log. Check internet and try again.");
  }
  if (r && r.log === false){
    localStorage.removeItem('gate_staff');
    if (staffCode(true) === null){ startScanner(); return; }
    return showLog();
  }
  renderLog((r && r.entries) || []);
}

function fmtEntryTime(s){
  s = String(s || "");
  let iso = s.replace(" ", "T");
  const m = iso.match(/([+-]\d{2})$/); if (m) iso += ":00";
  const d = new Date(iso);
  if (isNaN(d)) return s.slice(11, 16);
  return d.toLocaleTimeString("en-IN", { hour:"2-digit", minute:"2-digit", hour12:true });
}

function payBadge(e){
  const pm = String(e.PayMode || "").toLowerCase();
  if (pm === "gate_waived") return ["⚠️ Waived", "#fee2e2;color:#b91c1c"];
  if (pm === "gate_cash")   return ["💵 Cash", "#dcfce7;color:#15803d"];
  if (pm === "gate_upi")    return ["📱 UPI at gate", "#dcfce7;color:#15803d"];
  if (String(e.Status || "").toUpperCase() === "PAID") return ["✅ Paid online", "#dcfce7;color:#15803d"];
  return ["⏳ Unpaid", "#fef3c7;color:#b45309"];
}

function renderLog(entries){
  logEntries = entries;
  show("resultView");
  $("resultView").innerHTML =
    `<div class="card">
       <div class="name">Tonight's admissions</div>
       <div class="sub" id="logCount"></div>
       <input id="logSearch" type="search" placeholder="🔍 Name or booking code…" autocomplete="off"
              style="width:100%;margin:12px 0 4px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;box-sizing:border-box"
              oninput="drawLogRows(this.value)">
       <div id="logRows"></div>
       <button class="btn-dark" style="margin-top:14px" onclick="startScanner()">← Back to scanner</button>
     </div>`;
  drawLogRows("");
}

function drawLogRows(filter){
  const f = String(filter || "").trim().toLowerCase();
  const list = logEntries.filter(e => !f ||
    String(e.Name || "").toLowerCase().includes(f) ||
    String(e.BookingID || "").toLowerCase().includes(f));
  const people = list.reduce((s,e)=> s + (Number(e.CheckedInCount)||0), 0);
  $("logCount").textContent = list.length + " QR" + (list.length===1?"":"s") + " · " + people + " people admitted (last 14 h)";
  $("logRows").innerHTML = list.length ? list.map(e => {
    const badge = payBadge(e);
    const partyBits = [Number(e.Men)>0 ? e.Men+"M" : "", Number(e.Women)>0 ? e.Women+"W" : "",
                       Number(e.Couples)>0 ? e.Couples+"C" : ""].filter(Boolean).join(" ");
    return `<div style="border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin-top:8px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
        <b style="font-size:16px">${esc(e.Name || "Guest")}</b>
        <span style="white-space:nowrap;color:#64748b;font-size:13px">${esc(fmtEntryTime(e.CheckInTime))}</span>
      </div>
      <div class="sub" style="margin-top:2px">${esc(e.BookingID)} · in ${Number(e.CheckedInCount)||0}/${Number(e.Seats)||"?"}${partyBits ? " · " + esc(partyBits) : ""}</div>
      <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center">
        <span class="pill" style="background:${badge[1]}">${badge[0]}</span>
        <span style="font-weight:700">${rupee(e.AmountCollected)}</span>
      </div>
    </div>`; }).join("")
    : `<p class="sub" style="margin-top:12px">${f ? "No match for that search." : "No admissions recorded yet tonight."}</p>`;
}

function renderAlreadyScanned(d){
  show("resultView");
  const seats = Number(d.seats)||0, entered = Number(d.checkedIn)||seats;
  $("resultView").innerHTML =
    `<div class="card center" style="border-top:6px solid #b45309">
       <div class="big-emoji">🚫</div>
       <div class="msg-title">QR already scanned</div>
       <div style="font-size:18px;font-weight:700">${entered} of ${seats||'?'} already entered</div>
       <div class="sub">This code is used up — no entries left on it.</div>
       <button class="btn-primary" style="margin-top:20px" onclick="startScanner()">Scan next QR</button>
     </div>`;
}

function renderMessage(color, emoji, title, body){
  show("resultView");
  $("resultView").innerHTML =
    `<div class="card center" style="border-top:6px solid ${color}">
       <div class="big-emoji">${emoji}</div>
       <div class="msg-title">${esc(title)}</div>
       <div class="sub">${esc(body)}</div>
       <button class="btn-dark" onclick="startScanner()">Scan next</button>
     </div>`;
}

if ("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
startScanner();
</script>
</body>
</html>
